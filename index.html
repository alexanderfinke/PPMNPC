<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cost Tracker</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --success: #16a34a;
        --danger: #dc2626;
        --warning: #f59e0b;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 25px;
        color: var(--text);
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 25px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .card h3 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .card .value {
        font-size: 28px;
        font-weight: bold;
        margin: 0;
      }

      .card .trend-positive {
        color: var(--success);
      }

      .card .trend-negative {
        color: var(--danger);
      }

      .content-grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 25px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: var(--text);
        font-weight: 600;
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 11px 16px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
      }

      .primary-btn {
        background: var(--primary);
        color: white;
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #eef2ff;
        color: var(--primary-dark);
      }

      .secondary-btn:hover {
        background: #e0e7ff;
      }

      .danger-btn {
        background: #fee2e2;
        color: var(--danger);
      }

      .danger-btn:hover {
        background: #fecaca;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th {
        background: #f8fafc;
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
      }

      .status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .status.within {
        background: #dcfce7;
        color: #166534;
      }

      .status.over {
        background: #fee2e2;
        color: #991b1b;
      }

      .status.pending {
        background: #fef3c7;
        color: #92400e;
      }

      .inline-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      .input-row > * {
        flex: 1;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 30px 12px;
      }

      @media (max-width: 900px) {
        .content-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <h1>Planned vs Actual Cost Tracker</h1>
        <button class="secondary-btn" id="refreshBtn">Refresh</button>
      </div>

      <div class="summary-grid">
        <div class="card">
          <h3>Total Planned</h3>
          <p class="value" id="plannedTotal">$0.00</p>
        </div>
        <div class="card">
          <h3>Total Actual</h3>
          <p class="value" id="actualTotal">$0.00</p>
        </div>
        <div class="card">
          <h3>Variance</h3>
          <p class="value" id="varianceTotal">$0.00</p>
        </div>
        <div class="card">
          <h3>Variance %</h3>
          <p class="value" id="variancePercent">0.00%</p>
        </div>
      </div>

      <div class="content-grid">
        <div class="panel">
          <h2>Add Planned Cost</h2>
          <form id="costForm">
            <label>
              Item Name
              <input type="text" id="itemName" placeholder="Example: Office Supplies" required />
            </label>

            <label>
              Category
              <select id="category">
                <option value="General">General</option>
                <option value="Operations">Operations</option>
                <option value="Marketing">Marketing</option>
                <option value="Travel">Travel</option>
                <option value="Software">Software</option>
                <option value="Equipment">Equipment</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label>
              Planned Cost
              <input type="number" id="plannedCost" step="0.01" min="0" placeholder="0.00" required />
            </label>

            <label>
              Notes
              <textarea id="notes" placeholder="Optional details..."></textarea>
            </label>

            <button type="submit" class="primary-btn">Add Entry</button>
          </form>
        </div>

        <div class="panel">
          <h2>Cost Entries</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Planned</th>
                  <th>Actual</th>
                  <th>Variance</th>
                  <th>Status</th>
                  <th>Notes</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="entriesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      function formatCurrency(value) {
        const num = Number(value || 0);
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD"
        }).format(num);
      }

      function formatVariance(value) {
        const num = Number(value || 0);
        return `${num >= 0 ? "+" : "-"}${formatCurrency(Math.abs(num))}`;
      }

      function getStatusClass(status) {
        if (!status) return "pending";
        const normalized = status.toLowerCase();
        if (normalized.includes("over")) return "over";
        if (normalized.includes("within")) return "within";
        return "pending";
      }

      function renderSummary(summary) {
        document.getElementById("plannedTotal").textContent = formatCurrency(summary.totalPlanned || 0);
        document.getElementById("actualTotal").textContent = formatCurrency(summary.totalActual || 0);

        const variance = Number(summary.totalVariance || 0);
        const varianceValue = document.getElementById("varianceTotal");
        varianceValue.textContent = `${variance >= 0 ? "+" : "-"}${formatCurrency(Math.abs(variance))}`;
        varianceValue.classList.toggle("trend-positive", variance <= 0);
        varianceValue.classList.toggle("trend-negative", variance > 0);

        const variancePercent = Number(summary.percentageVariance || 0);
        const variancePercentEl = document.getElementById("variancePercent");
        variancePercentEl.textContent = `${variancePercent.toFixed(2)}%`;
        variancePercentEl.classList.toggle("trend-positive", variancePercent <= 0);
        variancePercentEl.classList.toggle("trend-negative", variancePercent > 0);
      }

      function renderRows(entries) {
        const tbody = document.getElementById("entriesTableBody");

        if (!entries || entries.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="empty-state">No cost entries yet.</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = entries.map((entry) => {
          const planned = Number(entry.plannedCost || 0);
          const actual = Number(entry.actualCost || 0);
          const variance = actual - planned;
          const status = entry.status || (actual ? (variance <= 0 ? "Within Budget" : "Over Budget") : "Pending");

          return `
            <tr>
              <td>${entry.itemName || "-"}</td>
              <td>${entry.category || "General"}</td>
              <td>${formatCurrency(planned)}</td>
              <td>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  value="${entry.actualCost || ""}"
                  data-id="${entry.id}"
                  data-field="actualCost"
                  style="width: 100px;"
                  aria-label="Actual cost for ${entry.itemName || "item"}"
                />
              </td>
              <td>${formatCurrency(variance)}</td>
              <td>
                <span class="status ${getStatusClass(status)}">${status}</span>
              </td>
              <td>${entry.notes || "-"}</td>
              <td>
                <div class="inline-actions">
                  <button type="button" class="secondary-btn save-actual" data-id="${entry.id}">Save</button>
                  <button type="button" class="danger-btn delete-entry" data-id="${entry.id}">Delete</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");
      }

      function reloadData() {
        google.script.run
          .withSuccessHandler((entries) => {
            renderRows(entries);
          })
          .getCostEntries();

        google.script.run
          .withSuccessHandler((summary) => {
            renderSummary(summary);
          })
          .getSummary();
      }

      document.getElementById("costForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const itemName = document.getElementById("itemName").value.trim();
        const category = document.getElementById("category").value;
        const plannedCost = document.getElementById("plannedCost").value;
        const notes = document.getElementById("notes").value.trim();

        if (!itemName || !plannedCost) {
          alert("Please enter an item name and planned cost.");
          return;
        }

        google.script.run
          .withSuccessHandler(() => {
            document.getElementById("costForm").reset();
            reloadData();
          })
          .addCostEntry(itemName, category, Number(plannedCost), notes);
      });

      document.addEventListener("click", function (event) {
        const deleteBtn = event.target.closest(".delete-entry");
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          if (confirm("Delete this cost entry?")) {
            google.script.run
              .withSuccessHandler(() => {
                reloadData();
              })
              .deleteCostEntry(id);
          }
        }

        const saveBtn = event.target.closest(".save-actual");
        if (saveBtn) {
          const id = saveBtn.dataset.id;
          const rowInput = document.querySelector(`input[data-id="${id}"][data-field="actualCost"]`);
          if (!rowInput) return;

          const actualCost = rowInput.value;
          if (actualCost === "") {
            alert("Please enter an actual cost before saving.");
            return;
          }

          google.script.run
            .withSuccessHandler(() => {
              reloadData();
            })
            .updateActualCost(id, Number(actualCost));
        }
      });

      document.getElementById("refreshBtn").addEventListener("click", reloadData);

      reloadData();
    </script>
  </body>
</html>
